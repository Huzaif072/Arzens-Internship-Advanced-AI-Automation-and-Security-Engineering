---
- name: Check root SSH login is disabled
  ansible.builtin.command: sshd -T
  register: sshd_effective
  changed_when: false
- name: Check firewall status
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
- name: Check auditd is active
  ansible.builtin.command: systemctl is-active auditd
  register: auditd_status
  changed_when: false
- name: Write compliance report
  ansible.builtin.copy:
    dest: /var/log/arzens-compliance-report.txt
    owner: root
    group: root
    mode: '0640'
    content: |
      ARZENS CIS-ALIGNED COMPLIANCE REPORT
      Generated by Ansible on {{ inventory_hostname }}
      ssh_root_login_disabled={{ 'PASS' if 'permitrootlogin no' in sshd_effective.stdout else 'FAIL' }}
      ssh_password_auth_disabled={{ 'PASS' if 'passwordauthentication no' in sshd_effective.stdout else 'FAIL' }}
      firewall_enabled={{ 'PASS' if 'Status: active' in ufw_status.stdout else 'FAIL' }}
      auditd_active={{ 'PASS' if auditd_status.stdout == 'active' else 'FAIL' }}
