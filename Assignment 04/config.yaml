# ML Threat Detection Pipeline Configuration
# Assignment 04 - Network Intrusion Detection (CICIDS2017-style)

random_state: 42
dataset:
  path: "network_traffic_dataset.csv"
  label_column: "label_binary"          # Benign / Attack (use "label" for multi-class)
  expected_min_rows: 50000
  expected_min_features: 40

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true

preprocessing:
  scaler: "StandardScaler"              # StandardScaler | MinMaxScaler
  handle_missing: "median"
  remove_duplicates: true
  feature_selection:
    enabled: true
    method: "mutual_info"
    top_k: 35
  smote:
    enabled: true
    k_neighbors: 5
  pca:
    enabled: false
    n_components: 20

models:
  random_forest:
    enabled: true
    param_grid:
      n_estimators: [100, 200]
      max_depth: [10, 20, null]
      min_samples_split: [2, 5]
    cv_folds: 5

  xgboost:
    enabled: true
    param_grid:
      learning_rate: [0.05, 0.1]
      n_estimators: [100, 200]
      max_depth: [4, 6]
      subsample: [0.8, 1.0]
    cv_folds: 5

  neural_network:
    enabled: true
    param_grid:
      learning_rate: [0.001, 0.0005]
      epochs: [30, 50]
      batch_size: [128, 256]
      dropout: [0.3]
    cv_folds: 3

hyperparameter_search:
  method: "RandomizedSearchCV"
  n_iter: 8
  scoring: "f1"

output:
  artifacts_dir: "model_artifacts"
  model_version: "v1.0_20260801"
  log_file: "training_log.csv"
